name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is retired on 2026-11-02 and its brownouts were already
        # cancelling the job before it started — every macOS run since
        # 7986555 ended "cancelled", so nothing below was being verified.
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Linux gets a swift.org toolchain. macOS builds with the Xcode the
      # runner ships, which is what anyone building on a Mac uses: the swift.org
      # 6.0.3 toolchain on macos-15 crashed the compiler (signal 6, emitting IR
      # for the SwiftUI App) against that image's newer SDK.
      - if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift --version
      # `review` shells out to the project's own package script, and the smoke
      # test asserts on that line. macOS only, because the smoke test is.
      - if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every job builds. This is the whole of what Linux is claimed to do, and
      # the only Linux claim the README makes.
      - run: swift build -c release

      # Everything below runs on macOS only, and that is a statement about
      # Linux rather than a convenience: the test module does not compile on
      # the toolchain here (XCTest's @MainActor isolation is applied more
      # strictly), so the job used to fail on `swift test` and take the
      # following steps down with it. A red run on every single push —
      # `main` included — said "broken" about a project whose macOS side was
      # passing in full, and it is the first thing anyone deciding whether to
      # install this would have seen.
      #
      # Skipping is not the same as passing, and the README says so in the
      # Status table: macOS is verified, Linux is shown to build and nothing
      # more. Do not quietly widen these guards to make the matrix look
      # greener — if you get the test module compiling on Linux, drop the
      # guard and change the README in the same commit.
      - if: runner.os == 'macOS'
        run: swift test
      - if: runner.os == 'macOS'
        run: python3 Scripts/test-build-contract.py
      - if: runner.os == 'macOS'
        run: make app
      - if: runner.os == 'macOS'
        run: GENTLEMERGE_BIN="$PWD/.build/release/gentlemerge" bash Scripts/smoke-test.sh
      # A crash in the app shows up above only as checks that waited in vain.
      # macOS writes the reason to a crash report; print the newest one.
      - if: failure() && runner.os == 'macOS'
        run: |
          report=$(ls -t ~/Library/Logs/DiagnosticReports/gentlemerge* 2>/dev/null | head -1)
          if [ -n "$report" ]; then head -c 6000 "$report"; else echo "no crash report"; fi
